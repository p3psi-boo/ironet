name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: docker
    steps:
      - name: Check out repository
        uses: https://data.forgejo.org/actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install build and release dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install --yes --no-install-recommends \
            binutils build-essential ca-certificates curl dpkg-dev file jq musl-tools pkg-config
          curl --proto '=https' --tlsv1.2 --silent --show-error --fail \
            https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain none
          echo "$HOME/.cargo/bin" >>"$FORGEJO_PATH"

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.98.0 \
            --profile minimal \
            --component clippy,rustfmt \
            --target x86_64-unknown-linux-musl

      - name: Resolve release package version
        run: |
          tag="${FORGEJO_REF_NAME#v}"
          if [[ "$FORGEJO_REF_NAME" != "v$tag" || ! "$tag" =~ ^[0-9]{4}\.[0-9]{2}\.[0-9]{4}$ ]]; then
            echo "release tag must be vYYYY.MM.ddNN" >&2
            exit 1
          fi

          day="${tag:0:10}"
          sequence="${tag:10:2}"
          day_iso="${day//./-}"
          commit_day=$(git show -s --format=%cs HEAD)
          if [[ "$commit_day" != "$day_iso" ]]; then
            echo "tag day $day does not match commit day $commit_day" >&2
            exit 1
          fi

          next_day=$(date -u -d "$day_iso +1 day" +%F)
          commits=$(git rev-list --count \
            --since="$day_iso 00:00:00 UTC" \
            --before="$next_day 00:00:00 UTC" \
            HEAD)
          if (( commits > 99 )); then
            echo "UTC commit count exceeds the two-digit tag sequence" >&2
            exit 1
          fi
          expected=$(printf '%02d' "$commits")
          if [[ "$sequence" != "$expected" ]]; then
            echo "tag sequence $sequence does not match UTC commit count $expected" >&2
            exit 1
          fi
          printf '%s\n' "$tag" >.release-version

      - name: Verify, test, and lint
        run: |
          cargo fmt --check
          python3 scripts/check-doc-links.py
          cargo test --locked
          cargo clippy --locked --all-targets -- -D warnings

      - name: Build static musl Debian package
        run: |
          VERSION="$(<.release-version)" scripts/build-deb.sh
          sha256sum dist/*.deb >dist/SHA256SUMS

      - name: Verify package and binary
        run: |
          dpkg-deb --info dist/*.deb
          dpkg-deb --contents dist/*.deb
          for binary in ironet ironetd; do
            file "target/x86_64-unknown-linux-musl/release/$binary"
            if readelf -l "target/x86_64-unknown-linux-musl/release/$binary" \
              | grep -q 'Requesting program interpreter'; then
              echo "$binary is dynamically linked" >&2
              exit 1
            fi
          done

      - name: Upload workflow artifacts
        uses: https://data.forgejo.org/actions/upload-artifact@v4
        with:
          name: ironet-${{ forgejo.ref_name }}-musl-deb
          path: |
            dist/*.deb
            dist/SHA256SUMS
          if-no-files-found: error

      - name: Publish Forgejo release
        env:
          FORGEJO_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
        run: scripts/publish-forgejo-release.sh dist/*.deb dist/SHA256SUMS
