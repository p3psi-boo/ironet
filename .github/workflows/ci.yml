name: CI

on:
  push:
    branches:
      - '**'
    tags-ignore:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          components: clippy,rustfmt

      - name: Cache Cargo data
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --check

      - name: Check documentation links
        run: python3 scripts/check-doc-links.py

      - name: Run tests
        run: cargo test --locked

      - name: Verify vendored noq-proto patch
        run: |
          cargo test --manifest-path crates/noq-proto-v2/Cargo.toml --locked
          cargo check --manifest-path crates/noq-proto-v2/Cargo.toml --features qlog --locked

      - name: Run Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

  deb:
    name: Debian package (${{ matrix.deb_arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            rust_target: x86_64-unknown-linux-musl
            deb_arch: amd64
          - runner: ubuntu-24.04-arm
            rust_target: aarch64-unknown-linux-musl
            deb_arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install packaging dependencies
        run: |
          sudo apt-get update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install --yes --no-install-recommends \
            binutils build-essential dpkg-dev file musl-tools pkg-config systemd

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          targets: ${{ matrix.rust_target }}

      - name: Cache Cargo data
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.rust_target }}

      - name: Build static Debian package
        env:
          TARGET: ${{ matrix.rust_target }}
        run: scripts/build-deb.sh

      - name: Verify package
        run: |
          package="dist/ironet_$(sed -n '/^\[package\]$/,/^\[/s/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n1)_${{ matrix.deb_arch }}.deb"
          test "$(dpkg-deb --field "$package" Architecture)" = "${{ matrix.deb_arch }}"
          tests/deployment/package.sh "$package"
          sha256sum "$package" >"$package.sha256"

      - name: Upload Debian package
        uses: actions/upload-artifact@v4
        with:
          name: ironet-deb-${{ matrix.deb_arch }}
          path: |
            dist/*.deb
            dist/*.deb.sha256
          if-no-files-found: error
          retention-days: 14
