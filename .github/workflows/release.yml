name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify release
    runs-on: ubuntu-24.04
    outputs:
      package_version: ${{ steps.version.outputs.package_version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve release package version
        id: version
        run: |
          if [[ "$GITHUB_EVENT_NAME" != push ]]; then
            version=$(sed -n '/^\[package\]$/,/^\[/s/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n1)
            echo "package_version=$version" >>"$GITHUB_OUTPUT"
            exit 0
          fi

          tag="${GITHUB_REF_NAME#v}"
          if [[ "$GITHUB_REF_NAME" != "v$tag" || ! "$tag" =~ ^[0-9]{4}\.[0-9]{2}\.[0-9]{4}$ ]]; then
            echo "release tag must be vYYYY.MM.ddNN" >&2
            exit 1
          fi

          day="${tag:0:10}"
          sequence="${tag:10:2}"
          day_iso="${day//./-}"
          commit_day=$(git show -s --format=%cs "$GITHUB_SHA")
          if [[ "$commit_day" != "$day_iso" ]]; then
            echo "tag day $day does not match commit day $commit_day" >&2
            exit 1
          fi

          next_day=$(date -u -d "$day_iso +1 day" +%F)
          commits=$(git rev-list --count \
            --since="$day_iso 00:00:00 UTC" \
            --before="$next_day 00:00:00 UTC" \
            "$GITHUB_SHA")
          if (( commits > 99 )); then
            echo "UTC commit count exceeds the two-digit tag sequence" >&2
            exit 1
          fi
          expected=$(printf '%02d' "$commits")
          if [[ "$sequence" != "$expected" ]]; then
            echo "tag sequence $sequence does not match UTC commit count $expected" >&2
            exit 1
          fi

          echo "package_version=$tag" >>"$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0
          components: clippy,rustfmt

      - name: Cache Cargo data
        uses: Swatinem/rust-cache@v2

      - name: Verify source
        run: |
          cargo fmt --check
          python3 scripts/check-doc-links.py
          cargo test --locked
          cargo clippy --locked --all-targets -- -D warnings

  build:
    name: Build Debian package (${{ matrix.deb_arch }})
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            rust_target: x86_64-unknown-linux-musl
            deb_arch: amd64
          - runner: ubuntu-24.04-arm
            rust_target: aarch64-unknown-linux-musl
            deb_arch: arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install packaging dependencies
        run: |
          sudo apt-get update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install --yes --no-install-recommends \
            binutils build-essential dpkg-dev file musl-tools pkg-config systemd

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0
          targets: ${{ matrix.rust_target }}

      - name: Cache Cargo data
        uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.rust_target }}

      - name: Build and verify package
        env:
          TARGET: ${{ matrix.rust_target }}
          VERSION: ${{ needs.verify.outputs.package_version }}
        run: |
          scripts/build-deb.sh
          package=$(find dist -maxdepth 1 -name 'ironet_*_${{ matrix.deb_arch }}.deb' -print -quit)
          test -n "$package"
          test "$(dpkg-deb --field "$package" Architecture)" = "${{ matrix.deb_arch }}"
          tests/deployment/package.sh "$package"
          sha256sum "$package" >"$package.sha256"

      - name: Attest package provenance
        if: github.event_name == 'push'
        uses: actions/attest@v4
        with:
          subject-path: dist/*.deb

      - name: Upload architecture artifact
        uses: actions/upload-artifact@v4
        with:
          name: ironet-release-${{ matrix.deb_arch }}
          path: |
            dist/*.deb
            dist/*.deb.sha256
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          pattern: ironet-release-*
          path: dist
          merge-multiple: true

      - name: Generate combined checksums
        run: |
          cd dist
          sha256sum -- *.deb | sort -k2 >SHA256SUMS
          sha256sum --check SHA256SUMS

      - name: Upload combined release artifact
        uses: actions/upload-artifact@v4
        with:
          name: ironet-release
          path: |
            dist/*.deb
            dist/*.deb.sha256
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.deb dist/*.deb.sha256 dist/SHA256SUMS --generate-notes --verify-tag
