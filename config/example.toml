# Ironet Protocol V2 configuration. Transport queues, PacketTrain geometry,
# pacing, PMTU, FEC/Repair, RX batching, cover budget and lane count remain
# automatic runtime decisions. Operational path-migration guardrails have an
# optional advanced section below, so changing them never requires a rebuild.
network_id = "REPLACE_WITH_RANDOM_NETWORK_ID"
identity_file = "/var/lib/ironet/identity.key"

# V2 owns one dual-stack UDP socket. Omit it to bind [::]:4000.
# bind_addresses = ["[::]:443"]

# Direct underlay endpoints inside these prefixes are rejected. For example,
# this excludes Yggdrasil while retaining public carrier IPv6.
excluded_underlay_prefixes = ["200::/7"]

tun_mtu = 32768
node_interface = "ironet0"
node_addresses = ["21.0.0.1/32", "21::1/128"]
advertised_prefixes = ["192.168.10.0/24"]

[node_info]
name = "branch-a"
description = "Example V2 branch router"

[node_info.metadata]
site = "example-site"

# Tailscale DERP custom transports. Omit the section for direct-only paths.
[relay]
# servers = ["https://derp-1.example.net/derp", "https://derp-2.example.net/derp"]

# Public QUIC ClientHello profile. EndpointId and membership are authenticated
# only inside the TLS-exporter-bound V2 SessionHello.
[cover]
sni_pool = ["media.example"]
profile_id = 1

[routing]
isolate_overlay = true
transit_enabled = true
rule_priority = 10000
table = 211
allow_default_routes = false
nat_enabled = true
# max_egress_mbps = 80

# Adaptive transport control is automatic. Shadow is the conservative default
# until the learned policy has passed the deployment's profile gates.
[autotune]
# mode = "shadow"          # off | shadow | on
# objective = "balanced"  # balanced | throughput | latency
# memory = true
# policy = "builtin"      # native | builtin | absolute .wasm path
#                         #   native  = explicit host conservative rules (no learner)
#                         #   builtin = default in-process CorePolicy; no Wasmtime
#                         #   path    = external signed .wasm component; failures
#                         #             fall back to the builtin core
# builtin.wasm is a bit-exact guest fixture and external package template,
# not the daemon's default execution path. External JSON artifacts were removed.
# shadow_policy = "/etc/ironet/policy.candidate.wasm"

# WASM policy trust store and resource budget. Only consulted when policy or
# shadow_policy names a .wasm component; the whole section is covered by the
# configuration seal, so signers, pins and paths cannot be changed by a guest.
# Values shown are the defaults.
# [autotune.wasm]
# require_signature = true         # production default; false requires digest_pins
# maximum_module_bytes = 8388608   # 8 MiB component file
# maximum_memory_bytes = 8388608   # 8 MiB guest linear memory
# maximum_state_bytes = 65536      # 64 KiB per-peer state, at most 1 MiB
# deadline_millis = 100            # single decide() wall deadline, 1..=1000
# state_flush_interval_secs = 60   # periodic state flush; also on switch/exit

# Trusted signers; several entries allow key rotation. Revoke by deleting the
# entry and re-sealing the configuration.
# [[autotune.wasm.signers]]
# signer_id = "ops-2026"
# public_key = "ed25519:BASE32-OR-HEX-32-BYTE-KEY"
# minimum_policy_version = 3       # rollback floor, default 0
# expires_at = "2027-01-01T00:00:00Z"   # optional RFC 3339

# Development alternative when require_signature = false: exact component
# digests. A module's self-reported key never establishes trust.
# digest_pins = ["blake3:<64 hex chars>"]

# Advanced path-migration guardrails. Omit this section in normal deployments:
# live deadlines are still derived automatically from measured RTT and ACK/PTO
# progress; failback additionally requires successful on-path PATH_RESPONSEs.
# Values shown here are defaults and may change without recompiling Ironet.
# [path_migration]
# pto_threshold = 4
# min_pto_silence_ms = 250
# min_silence_ms = 1000
# max_silence_ms = 5000
# recovery_probation_ms = 2000
# recovery_max_response_gap_ms = 2000
# recovery_min_responses = 3
# health_ttl_secs = 300
# rtt_switch_margin_ms = 5
# keep_alive_ms = 250
# idle_timeout_ms = 15000

[mesh]
enabled = true
max_peers = 12

[dns]
enabled = false
# domain = "n-REPLACE_WITH_NETWORK_ID.ironet.internal"
# listen_port = 1053
# short_names = true
# accept_dns = true
# ttl_secs = 5
# reverse_prefixes = ["21.0.0.0/24", "21::/64"]

# [[peers]]
# name = "branch-b"
# endpoint_id = "REPLACE_WITH_IROH_ENDPOINT_ID"
# direct_addresses = ["[2001:db8::10]:443"]
# When relay.servers is non-empty, use the peer's DERP public key:
# derp_public_key = "REPLACE_WITH_DERP_PUBLIC_KEY"

# A private circuit is a locator constraint, not a separate protocol. V2 still
# authenticates EndpointId and network membership on the QUIC connection.
# [[links]]
# name = "iepl-ab"
# peer_id = "REPLACE_WITH_IROH_ENDPOINT_ID"
# exclusive = true
# fallback = false
# remote_addresses = ["10.255.0.2:443"]
