[package]
name = "ironet-extension-sdk"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Stable control-plane extension SDK for Ironet"
license = "MIT OR Apache-2.0"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.53.1", features = ["io-util", "net"] }
