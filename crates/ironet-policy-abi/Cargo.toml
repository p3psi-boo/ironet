[package]
name = "ironet-policy-abi"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Policy ABI V1 types shared by the Ironet host, ironet-policy-core and policy guests"
license = "MIT OR Apache-2.0"

[dependencies]
serde = { version = "1.0.229", default-features = false, features = ["derive", "std"] }

[dev-dependencies]
postcard = "1.1.3"
serde_json = { version = "1.0", features = ["preserve_order"] }
